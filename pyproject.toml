[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualityci"
version = "0.2.0.dev0"
description = "Evidence-grounded manufacturing change regression for GOAI 2026"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=48,<49"]
keywords = ["manufacturing", "quality", "regression", "audit", "agents"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://qualityci.com"
Repository = "https://github.com/muchensu77-create/qualityci"
Documentation = "https://github.com/muchensu77-create/qualityci/tree/main/docs"
Issues = "https://github.com/muchensu77-create/qualityci/issues"

[project.optional-dependencies]
dev = [
  "jsonschema[format-nongpl]>=4.26,<5",
  "pytest>=8,<10",
  "referencing>=0.37,<1",
]

[project.scripts]
qualityci = "qualityci.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qualityci"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
